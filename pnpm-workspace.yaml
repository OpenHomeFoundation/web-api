# pnpm v10.26+/v11 reviews dependency build scripts and fails the install
# (ERR_PNPM_IGNORED_BUILDS) on any that haven't been explicitly reviewed.
# @nestjs/core's only postinstall is an Open Collective funding banner
# (`opencollective || exit 0`), so we acknowledge it and skip it.
# unrs-resolver (transitive, via jest-resolve) runs napi-postinstall to link a
# native binding. The prebuilt platform binary arrives as an optional
# dependency, so resolution works without running the script.
# @scarf/scarf (transitive, via @nestjs/swagger) reports installation analytics
# to a third party on postinstall. Nothing depends on it running, so it is
# skipped rather than allowed to phone home from developer machines and CI.
# esbuild (transitive, via likec4) has a postinstall that verifies its native
# binary. Same reasoning as unrs-resolver: the binary comes from a prebuilt
# optional dependency that esbuild resolves at runtime, so the check is not
# needed for it to work — `likec4 validate` exercises exactly that path.
# @parcel/watcher (transitive, via jest-haste-map) is a native filesystem
# watcher used only by Jest's --watch mode, which CI doesn't use; its install
# script builds/fetches its native binding from source, the same pattern as
# fsevents or esbuild. Official MIT-licensed package from the Parcel bundler
# project - allowed to build so plain `pnpm install` stops failing.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: false
  unrs-resolver: false

# Refuse to install any package version published less than 7 days ago
# (10080 minutes), mitigating supply-chain attacks that rely on freshly
# published malicious releases being picked up immediately.
minimumReleaseAge: 10080
